      - name: Vérifier la configuration e-mail
        if: steps.paris_time.outputs.run_report == 'true'
        id: email_config
        shell: bash
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ] && [ -n "$MAIL_TO" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Configuration SMTP absente : le PDF sera disponible comme artefact, sans envoi par e-mail."
          fi

      - name: Envoyer le PDF par e-mail
        if: steps.paris_time.outputs.run_report == 'true' && steps.email_config.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.office365.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Synthèse des médias — rapport hebdomadaire"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: "Le rapport PDF détaillé et le suivi cumulatif ont été générés automatiquement."
          attachments: output/*.pdf
