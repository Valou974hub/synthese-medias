name: Rapport hebdomadaire des médias

on:
  # GitHub Actions planifie uniquement en UTC.
  # 06:00 UTC correspond à 08:00 Paris pendant l'heure d'été (CEST).
  # 07:00 UTC correspond à 08:00 Paris pendant l'heure d'hiver (CET).
  schedule:
    - cron: "0 6 * * 1"
    - cron: "0 7 * * 1"

  # Autorise un lancement manuel depuis l'onglet Actions.
  workflow_dispatch:
    inputs:
      start_date:
        description: "Début de période au format YYYY-MM-DD (facultatif)"
        required: false
        type: string
      end_date:
        description: "Fin de période au format YYYY-MM-DD (facultatif)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: rapport-hebdomadaire-medias
  cancel-in-progress: false

jobs:
  generate-report:
    name: Collecter et générer le rapport
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier l'horaire Europe/Paris
        id: paris_time
        shell: bash
        run: |
          paris_hour="$(TZ=Europe/Paris date +%H)"
          paris_day="$(TZ=Europe/Paris date +%u)"

          echo "Heure locale Paris : $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M %Z')"

          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$paris_day" != "1" ] || [ "$paris_hour" != "08" ]; }; then
            echo "run_report=false" >> "$GITHUB_OUTPUT"
            echo "Cette exécution UTC ne correspond pas au lundi 08:00, heure de Paris."
          else
            echo "run_report=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer Python
        if: steps.paris_time.outputs.run_report == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        if: steps.paris_time.outputs.run_report == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Déterminer les arguments de période
        if: steps.paris_time.outputs.run_report == 'true'
        id: period
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ -n "${{ inputs.start_date }}" ] && \
             [ -n "${{ inputs.end_date }}" ]; then
            echo "collector_args=--start ${{ inputs.start_date }} --end ${{ inputs.end_date }}" >> "$GITHUB_OUTPUT"
            echo "report_args=--start ${{ inputs.start_date }} --end ${{ inputs.end_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "collector_args=" >> "$GITHUB_OUTPUT"
            echo "report_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Collecter les articles de la semaine
        if: steps.paris_time.outputs.run_report == 'true'
        run: python collect_rss.py ${{ steps.period.outputs.collector_args }}

      - name: Générer le PDF détaillé
        if: steps.paris_time.outputs.run_report == 'true'
        run: python generate_report.py ${{ steps.period.outputs.report_args }}

      - name: Vérifier les fichiers générés
        if: steps.paris_time.outputs.run_report == 'true'
        shell: bash
        run: |
          test -n "$(find output -maxdepth 1 -type f -name '*.pdf' -print -quit)"
          test -n "$(find data -maxdepth 1 -type f -name 'articles_*.json' -print -quit)"
          test -f data/cumulative.json

      - name: Publier le rapport comme artefact
        if: steps.paris_time.outputs.run_report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synthese-medias-${{ github.run_number }}
          path: |
            output/*.pdf
            data/articles_*.json
            data/cumulative.json
          if-no-files-found: error
          retention-days: 90
          
      - name: Envoyer le PDF par e-mail
        if: steps.paris_time.outputs.run_report == 'true'
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from datetime import datetime
          from email.message import EmailMessage
          from pathlib import Path
          from zoneinfo import ZoneInfo

          required = ["SMTP_USERNAME", "SMTP_APP_PASSWORD", "EMAIL_TO"]
          missing = [key for key in required if not os.environ.get(key)]

          if missing:
              raise SystemExit(
                  "Secrets e-mail manquants ou vides : " + ", ".join(missing)
              )

          pdfs = sorted(Path("output").glob("*.pdf"))
          if not pdfs:
              raise SystemExit("Aucun PDF n'a été trouvé dans le dossier output.")

          pdf_path = pdfs[-1]
          recipients = [
              address.strip()
              for address in os.environ["EMAIL_TO"].split(",")
              if address.strip()
          ]

          if not recipients:
              raise SystemExit("EMAIL_TO ne contient aucun destinataire valide.")

          now = datetime.now(ZoneInfo("Europe/Paris"))

          message = EmailMessage()
          message["From"] = os.environ["SMTP_USERNAME"]
          message["To"] = ", ".join(recipients)
          message["Subject"] = (
              "Synthèse des médias français — "
              f"semaine générée le {now:%d/%m/%Y}"
          )
          message.set_content(
              "Vous trouverez ci-joint la synthèse des médias français "
              "générée automatiquement.\n"
          )

          with pdf_path.open("rb") as attachment:
              message.add_attachment(
                  attachment.read(),
                  maintype="application",
                  subtype="pdf",
                  filename=pdf_path.name,
              )

          context = ssl.create_default_context()

          with smtplib.SMTP_SSL(
              "smtp.gmail.com",
              465,
              context=context,
          ) as smtp:
              smtp.login(
                  os.environ["SMTP_USERNAME"],
                  os.environ["SMTP_APP_PASSWORD"],
              )
              smtp.send_message(message)

          print(
              "E-mail envoyé avec succès à : "
              + ", ".join(recipients)
          )
          PY
          
      - name: Enregistrer le suivi cumulatif dans le dépôt
        if: steps.paris_time.outputs.run_report == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cumulative.json data/articles_*.json

          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle à enregistrer."
          else
            git commit -m "Mettre à jour la synthèse médias hebdomadaire"
            git push
          fi
